[pytest]
testpaths = tests
addopts = -q

filterwarnings =
    # FastAPI rebuilds the request model per route and pydantic 2.13 emits a false
    # positive saying Field(alias=...) "has no effect". tests/test_api.py::
    # test_camel_case_body_is_actually_applied proves the alias IS applied.
    ignore:The 'alias' attribute with value
