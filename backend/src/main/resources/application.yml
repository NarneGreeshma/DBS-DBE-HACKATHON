spring:
  application:
    name: smarthire-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smarthire}
    username: ${DB_USER:smarthire}
    password: ${DB_PASSWORD:smarthire}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      pool-name: smarthire-pool

  jpa:
    hibernate:
      ddl-auto: validate          # Flyway owns the schema; Hibernate only verifies it
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
    defer-datasource-initialization: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    out-of-order: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

  profiles:
    default: default

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

smarthire:
  jwt:
    secret: ${JWT_SECRET:cmM0LW9uLXRoZS1ncmVlbi1jaGlja2VuLXNlY3JldC1rZXktZm9yLXNtYXJ0aGlyZS1qd3Qtc2lnbmluZy0yMDI0}
    access-token-minutes: ${JWT_ACCESS_MINUTES:30}
    refresh-token-days: ${JWT_REFRESH_DAYS:7}
  cors:
    # Set CORS_ORIGINS to pin exact origins (production). Empty => use the localhost patterns below.
    allowed-origins: ${CORS_ORIGINS:}
    allowed-origin-patterns: ${CORS_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,http://[::1]:*}
  ai:
    base-url: ${AI_BASE_URL:http://localhost:8000}
    enabled: ${AI_ENABLED:true}
    timeout-ms: ${AI_TIMEOUT_MS:20000}
  storage:
    upload-dir: ${UPLOAD_DIR:./data/uploads}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.smarthire: INFO
    org.flywaydb: INFO
